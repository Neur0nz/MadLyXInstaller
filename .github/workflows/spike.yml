name: spike

# Builds the throwaway SmartScreen probe and publishes it as a prerelease with
# build provenance attestation, so the downloaded binary can be verified as
# having been built by this workflow from this commit.
#
# Triggered only by tags ending in -spike, or manually. Nothing here builds or
# releases the real installer.

on:
  push:
    tags:
      - 'v*-spike'
  workflow_dispatch:

permissions:
  contents: write      # create the release
  id-token: write      # Sigstore signing for the attestation
  attestations: write  # record the attestation

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false

      # go:embed cannot reach outside its own package directory, so the payload
      # is copied in at build time rather than duplicated in version control.
      - name: Stage payload
        run: cp -r payload spike/payload

      - name: Build (windows/amd64)
        working-directory: spike
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          COMMIT="$(git rev-parse --short HEAD)"
          go build -trimpath \
            -ldflags="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT}" \
            -o ../madlyx-spike.exe .

      - name: Report artifact
        run: |
          ls -l madlyx-spike.exe
          echo "sha256: $(sha256sum madlyx-spike.exe | cut -d' ' -f1)"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: madlyx-spike.exe

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="v0.0.1-spike-manual"
            git tag -f "$TAG" && git push -f origin "$TAG" || true
          fi
          gh release create "$TAG" madlyx-spike.exe \
            --prerelease \
            --title "SmartScreen spike $TAG" \
            --notes "Throwaway probe testing whether Windows SmartScreen blocks an unsigned, freshly published binary. Not the installer. Safe to delete." \
            || gh release upload "$TAG" madlyx-spike.exe --clobber
