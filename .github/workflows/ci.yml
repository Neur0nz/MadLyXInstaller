name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Fast feedback: vet and the unit tests, which need neither LyX nor TeX.
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Stage payload
        shell: bash
        run: cp -r payload go/internal/payload/data

      - name: Vet
        working-directory: go
        run: go vet ./...

      - name: Test
        working-directory: go
        run: go test ./... -v

      # Independent steps run concurrently and share the Context, so a data
      # race here would be a real bug. windows-latest ships a C toolchain,
      # which -race needs.
      - name: Test with the race detector
        working-directory: go
        env:
          CGO_ENABLED: '1'
        run: go test ./internal/step/ ./internal/ui/ -race -count=1

      - name: Build
        working-directory: go
        run: go build -trimpath -o madlyx.exe ./cmd/madlyx

      # The payload must ship byte-identical to what Kali published.
      # .gitattributes marks payload/** as -text; this proves it held.
      - name: Verify payload was not rewritten
        shell: bash
        working-directory: go
        run: |
          set -e
          expect_bind23=38651
          actual=$(stat -c%s internal/payload/data/bind/madlyx-2.3.bind)
          if [ "$actual" != "$expect_bind23" ]; then
            echo "payload was rewritten: madlyx-2.3.bind is $actual bytes, expected $expect_bind23"
            exit 1
          fi
          echo "payload intact"

      - name: Doctor runs and reports cleanly on a bare machine
        working-directory: go
        run: |
          ./madlyx.exe doctor; if ($LASTEXITCODE -gt 1) { throw "doctor crashed with $LASTEXITCODE" }
          ./madlyx.exe --dry-run --yes; if ($LASTEXITCODE -ne 0) { throw "dry-run failed" }

      # bootstrap.ps1 is piped into iex, which runs in the caller's scope, so a
      # parameter named after an automatic variable fails at runtime with
      # "Cannot overwrite variable Args because the variable has been
      # optimized" - and only when actually piped, never when run as a file.
      - name: Bootstrap avoids reserved variable names
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/bootstrap.ps1", [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw "bootstrap.ps1 does not parse: $($errors[0].Message)" }

          $reserved = @('Args','Input','Host','Error','PSItem','This','Matches','PWD','MyInvocation')
          foreach ($p in $ast.ParamBlock.Parameters) {
            $name = $p.Name.VariablePath.UserPath
            if ($reserved -contains $name) {
              throw "bootstrap.ps1 declares `$$name, which is a reserved automatic variable and breaks under iex"
            }
          }
          Write-Host "no reserved parameter names"

      # The documented one-liner must survive being piped, which is where the
      # reserved-name and top-level-exit bugs both showed up.
      - name: Bootstrap survives being piped into iex
        shell: powershell
        run: |
          $src = Get-Content "$PWD\bootstrap.ps1" -Raw
          # Point it at a repo that does not exist so it fails fast without
          # downloading; we are testing the plumbing, not the download.
          $src | Invoke-Expression -ErrorAction Stop
          Write-Host "survived iex; LASTEXITCODE=$LASTEXITCODE"

      # A PowerShell function returns whatever is left on its pipeline, so
      # `$code = Invoke-MadLyxBootstrap ...` captured everything madlyx.exe
      # printed. Every one-liner run looked silent: no banner, no steps, no
      # summary. It also made stdout a pipe rather than a console, so the
      # installer concluded it was unattended and stopped asking questions -
      # which is why elevation was never offered and Defender exclusions failed
      # with "needs administrator rights". Nothing in the Go code could have
      # revealed this; only running the real bootstrap does.
      - name: Bootstrap does not swallow the installer's output
        shell: powershell
        run: |
          $out = & "$PWD\bootstrap.ps1" --version 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'madlyx version') {
            throw "bootstrap.ps1 swallowed madlyx.exe's stdout - the one-liner would look silent"
          }

  # The expensive one: a genuinely clean Windows runner, installing for real.
  # This is the only way to know the Hebrew smoke-test compile actually passes.
  install:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Stage payload
        shell: bash
        run: cp -r payload go/internal/payload/data

      - name: Build
        working-directory: go
        run: go build -trimpath -o madlyx.exe ./cmd/madlyx

      - name: Full install on a clean machine
        working-directory: go
        run: |
          ./madlyx.exe install --yes --skip-system
          if ($LASTEXITCODE -ne 0) { throw "install failed with $LASTEXITCODE" }

      # Re-running must be a no-op: every step reports itself already done.
      - name: Re-run is idempotent
        working-directory: go
        run: |
          $out = ./madlyx.exe install --yes --skip-system --skip-test 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "second run failed" }
          foreach ($needed in 'TeX distribution','LyX','MadLyX settings','MadLyX shortcuts') {
            if ($out -notmatch [regex]::Escape($needed)) { throw "second run did not mention $needed" }
          }

      - name: Doctor reports a healthy install
        working-directory: go
        run: |
          ./madlyx.exe doctor
          if ($LASTEXITCODE -ne 0) { throw "doctor found problems after a successful install" }

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: install-logs
          path: ${{ env.LOCALAPPDATA }}\MadLyXInstaller\*.log
          if-no-files-found: ignore
